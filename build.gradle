plugins {
    id("base")
    id("io.ia.sdk.modl") version("0.1.1")
}

allprojects {
    group = property("moduleId")
    version = property("moduleVersion")
}

def purgeStaleModuleArtifacts = tasks.register("purgeStaleModuleArtifacts") {
    outputs.upToDateWhen { false }

    doLast {
        subprojects.each { subproject ->
            def expectedJarName = "${subproject.name}-${subproject.version}.jar"
            def libsDir = subproject.layout.buildDirectory.dir("libs").get().asFile

            libsDir.listFiles()
                ?.findAll { it.isFile() && it.name.endsWith(".jar") }
                ?.findAll { it.name != expectedJarName }
                ?.each { it.delete() }
        }

        layout.buildDirectory.dir("moduleContent").get().asFile
            .listFiles()
            ?.findAll { it.isFile() && it.name.endsWith(".jar") }
            ?.each { it.delete() }
    }
}

tasks.matching {
    it.name in ["assembleModlStructure", "writeModuleXml", "zipModule"]
}.configureEach {
    dependsOn(purgeStaleModuleArtifacts)
    outputs.upToDateWhen { false }
}

// collectModlDependencies 不感知子项目版本变化，会留下旧版本 jar 并被打进 modl。
subprojects {
    tasks.matching { it.name == "collectModlDependencies" }.configureEach {
        outputs.upToDateWhen { false }
        doFirst {
            layout.buildDirectory.dir("artifacts").get().asFile
                .listFiles()
                ?.findAll { it.isFile() && it.name.endsWith(".jar") }
                ?.each { it.delete() }
        }
    }
}

ignitionModule {
    requiredIgnitionVersion = property('ignitionVersion')

    id = property('moduleId')
    name = property('moduleName')
    moduleVersion = property('moduleVersion')
    moduleDescription = property('moduleDescription')

    fileName = "${property('moduleId')}-${property('moduleVersion')}.modl"
    license = 'license.html'

    skipModlSigning.set(true)

    projectScopes.putAll([
            ':base'    : 'G',
            ':common'   : 'G',
            ':gateway'  : 'G',
            ':web-ui'   : 'G',
    ])

    moduleDependencies.putAll([
            'com.inductiveautomation.opcua': 'G',
    ])

    def gatewayHookClass = "${property('moduleId')}.gateway.GatewayHook".toString()
    hooks.putAll([
        (gatewayHookClass) : 'G',
    ])
}
