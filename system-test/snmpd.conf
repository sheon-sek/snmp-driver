# test agent for the polling checks; community matches cases.COMM
agentAddress udp:161
rocommunity st-public default
sysName st-agent
sysLocation systest
# v3 polling user (upgrade test: secrets must still decode after 1.0.0 -> 1.1.0)
createUser st-v3poll SHA-256 st-auth-pass-123 AES st-priv-pass-456
rouser st-v3poll priv
